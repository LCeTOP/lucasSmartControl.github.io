<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Control</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/recuperação-de-senha.css">
</head>

<body>

<main class="recuperação-card">

<img src="assets/imagens/LOGO.png" alt="Logo Smart Control" class="logo">

<h2>Alteração de Senha</h2>

<p>Altere sua senha para realizar login.</p>

<form>

<label for="usuario">Senha</label>

<input
type="email"
id="usuario"
placeholder="Digite a nova senha"
required>

<label for="senha">Confirmar Senha</label>

<input
type="password"
id="senha"
placeholder="Digite sua senha novamente"
required>

<a href="index.html" class="btn">Voltar para login</a>

</form>

<footer>
©2026 Smart Control. Direitos Reservados.
</footer>

</main>

</body>
</html>
